# Generate Paxa Labs voice-over (Thai/English/Mandarin) on GitHub's runners.
# Why here: api.paxalabs.com is not reachable from Claude's cloud workspace, but GitHub runners can reach it,
# and the API key stays in the repo secret PAXA_API_KEY (Settings → Secrets and variables → Actions).
#
# Runs for every episode whose voice.engine is "paxa", once per voice in voice.candidates (or voice.speaker).
# Output: one zip per episode and voice (v1.wav … vN.wav, already fitted to their slots), uploaded to the
# pre-release "voice-cache". Download: gh release download voice-cache -R ngamtud/querious-vdo -p '<ep>-<voice>.zip'
# then: python3 engine/mix.py episodes/<ep> --voice-dir <unzipped folder>
name: voice-paxa
on:
  push:
    paths:
      - 'episodes/**/episode.json'
      - 'engine/tts.py'
      - '.github/workflows/voice-paxa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-paxa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -q soundfile
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Generate voices
        env:
          PAXA_API_KEY: ${{ secrets.PAXA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$PAXA_API_KEY" ]; then echo "::error::Repo secret PAXA_API_KEY is missing"; exit 1; fi
          gh release view voice-cache >/dev/null 2>&1 || \
            gh release create voice-cache --prerelease --title "Voice cache (generated audio, not source)" \
              --notes "Voice-over generated by .github/workflows/voice-paxa.yml. Overwritten on each run."
          mkdir -p out
          for ep in episodes/*/; do
            ep=${ep%/}; name=$(basename "$ep")
            python3 - "$ep" > /tmp/voices <<'PY' || continue
          import json, sys
          v = json.load(open(sys.argv[1] + '/episode.json'))['voice']
          if v.get('engine') != 'paxa': sys.exit(1)
          print('\n'.join(v.get('candidates') or [v.get('speaker', 'foithong')]))
          PY
            for spk in $(cat /tmp/voices); do
              echo "::group::$name / $spk"
              python3 engine/tts.py "$ep" --speaker "$spk" --out-dir "out/$name-$spk"
              (cd out && zip -q -r "$name-$spk.zip" "$name-$spk")
              gh release upload voice-cache "out/$name-$spk.zip" --clobber
              echo "::endgroup::"
            done
          done
