const rankAt=d=>NAMES.slice().sort((a,b)=>val(b,d)-val(a,d));
const MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const dstr=d=>{const x=new Date(DAY0+Math.round(d)*864e5);return `${x.getUTCDate()} ${MON[x.getUTCMonth()]} ${x.getUTCFullYear()}`};

function scene(dark,t,t0,t1,head,body){const z=1+.015*S((t-t0)/(t1-t0));
  return `<section class="scene ${dark?'dark':'light'}"><div class="grid"></div><img class="logo" src="../../brand/querious-logo-${dark?'lime':'dark'}.svg">${head}<div class="cam" style="transform:scale(${z})">${body}</div></section>`}
const topbar=tag=>`<div class="top L"><div class="brand"><i>Q</i>uerious<span class="cur">_</span></div><div class="tag mono">${tag}</div></div>`;
const eyebrow=html=>`<div class="L mono eyebrowD">${html}</div>`;
function caption(t,list){let i=-1;list.forEach((c,j)=>{if(t>=c[0])i=j});if(i<0||list[i][1]==='')return '';
  return `<div class="N caption" style="${fade(t,list[i][0],.3,14)}">${list[i][1]}</div>`}

/* ---------- hook ---------- */
function hook(t){
  return scene(true,t,0,T.race,eyebrow('Querious / <b>ศึกพลังไฟ AI</b>'),
  `<div class="L mono" style="top:470px;font-size:23px;color:#A9B4A2;${fade(t,.2)}">พลังไฟดาต้าเซ็นเตอร์ AI · แยกตามเจ้าของ</div>
   <div class="L q-h" style="top:540px">${['ใครจะครอง','พลังไฟ AI','<span class="y">มากที่สุด?</span>'].map((l,i)=>`<div style="${fade(t,.3+i*.22,.35,24)}">${l}${i===2?cur(t):''}</div>`).join('')}</div>
   <div class="L mono" style="top:1000px;font-size:26px;color:#DCE3D3;${fade(t,1.4)}">2024 → 2028</div>
   <div class="drule"></div><div class="N mono note" style="top:1440px">Epoch AI · ดาต้าเซ็นเตอร์ AI ราว 100 แห่งที่ติดตาม<br>ไม่ใช่ยอดรวมทั้งบริษัท</div>`)}

/* ---------- race ---------- */
const ROWS=8,ROW_Y=592,ROW_H=80,MAXW=520;
// deterministic rank simulation from race start: swap only past a 1.5%-of-leader margin, ease positions (tau 0.14 s)
const SIM=[];const FPS=30;
function layout(t){const f=Math.max(0,Math.round((t-T.race)*FPS));
  if(!SIM.length){const d=dayAtS(T.race),o=rankAt(d),p={};o.forEach((n,i)=>p[n]=Math.min(i,ROWS));SIM.push({o,p})}
  while(SIM.length<=f){const prev=SIM[SIM.length-1],tt=T.race+SIM.length/FPS,d=dayAtS(tt),o=prev.o.slice(),lead=Math.max(...o.map(n=>val(n,d)));
    for(let i=0;i<o.length-1;i++)if(val(o[i+1],d)>val(o[i],d)+(d>=LAST?0:.015)*lead){[o[i],o[i+1]]=[o[i+1],o[i]];i=Math.max(-1,i-2)}
    const k=1-Math.exp(-1/FPS/.11),p={};o.forEach((n,i)=>{const tgt=Math.min(i,ROWS);p[n]=prev.p[n]+(tgt-prev.p[n])*k});SIM.push({o,p})}
  return SIM[f].p}
function SIM_TGT(t){const f=Math.max(0,Math.round((t-T.race)*FPS));const o=SIM[Math.min(f,SIM.length-1)].o,r={};o.forEach((n,i)=>r[n]=Math.min(i,ROWS));return r}
function race(t){
  const d=dayAtS(t), proj=d>TODAY+.5;
  const lead=Math.max(...NAMES.map(n=>val(n,d))), scale=MAXW/Math.max(lead,300);
  const pos=layout(t);
  const fin=t>=42.0, call=E((t-45.9)/.4);
  let rows='';
  const tgt=SIM_TGT(t);NAMES.slice().sort((a,b)=>(pos[a]-tgt[a])-(pos[b]-tgt[b])).forEach(n=>{
    const p=pos[n];if(p>ROWS-.02)return;const v=val(n,d),w=Math.max(2,v*scale),vt=Math.min(v,val(n,TODAY))*scale,co=CO[n];
    const edge=C(ROWS-p), dim=fin&&call>0&&n!=='Oracle'?1-.6*call:1;
    rows+=`<div class="row" style="top:${ROW_Y+p*ROW_H}px;opacity:${edge*dim}"><div class="badge" style="background:${co.c}">${co.lg?`<svg width="${co.sz||34}" height="${co.sz||34}" viewBox="${LOGO[co.lg].vb}">${LOGO[co.lg].svg}</svg>`:co.m}</div><div class="nm">${co.n||n}</div>
      <div class="bar" style="width:${w}px;background:${co.c}">${proj&&w>vt+1?`<div class="hatch" style="left:${vt}px;right:0"></div>`:''}</div>
      <div class="val" style="left:${72+w+12}px">${fmt(v)} <span style="font-size:17px;color:var(--muted)">MW</span></div></div>`});
  // today line (after today): solid = built by today, hatched = planned
  const chip=proj?`<div class="chip mono" style="background:#FAF9F3">คาดการณ์</div>`:(t>=22.0&&t<28.4?`<div class="chip mono" style="background:var(--lime)">วันนี้</div>`:'');
  const cards=fin?`<div class="N" id="callout" style="top:${ROW_Y+3*ROW_H+10}px;${fade(t,45.9,.4,16)}"><div class="mono">Oracle · สิ้นปี 2028 · ${fmt(D.stargate.oracle_mw_2028)} MW</div><div class="big">99%</div><p>คือ Stargate ห้าไซต์<br>ที่สร้างให้ OpenAI</p></div>`:'';
  return scene(false,t,T.race,T.question,topbar('ศึกพลังไฟ AI'),
  `<div class="L mono meta">กำลังไฟไอทีตามเจ้าของ / MW / ไซต์ใน Epoch AI</div>
   <div class="L" id="date"><div class="d">${dstr(d)}</div>${chip}</div>
   ${rows}${cards}
   <div class="N mono note" style="top:1262px">Epoch AI · ~100 ไซต์ที่ติดตาม ไม่ใช่ยอดรวมบริษัท<br>เฉลี่ยรายวันระหว่าง milestone · ลายเฉียง = ตามแผน<br>ไม่รวมไซต์ที่ไม่ระบุเจ้าของ</div>
   ${caption(t,[[4.3,'Google <span class="hl">นำห่าง</span>'],[8.9,'SpaceX AI <span class="hl">ขึ้นที่ 3</span>'],[12.6,'Amazon <span class="hl">ขึ้นที่ 2</span>'],[16.0,'<span class="hl">Meta</span> พุ่งขึ้น'],[22.4,'วันนี้ <span class="hl">Google</span> นำ'],[28.2,''],[31.1,'<span class="hl">Meta</span> แซง Google'],[35.6,'จับตา <span class="hl">Oracle</span>'],[42.2,'Oracle <span class="hl">≈</span> Google'],[45.9,'<span class="hl">99%</span> คือ Stargate']])}`)}

/* ---------- question ---------- */
function question(t){
  const lines=['แล้วใคร','จะได้ใช้','<span class="y">พลังไฟ</span>','<span class="y">ทั้งหมดนี้?</span>'];
  return scene(true,t,T.question,T.end,eyebrow('Querious / <b>เจ้าของ ≠ ผู้ใช้</b>'),
  `<div class="L q-h" style="top:520px">${lines.map((l,i)=>`<div style="${fade(t,50.6+i*.15,.35,24)}">${l}${i===3?cur(t):''}</div>`).join('')}</div>
   <div class="L mono" style="top:1040px;font-size:23px;color:#A9B4A2;${fade(t,51.6)}">เจ้าของสร้าง · แล็บ AI ใช้</div>
   <div class="drule"></div><div class="N mono note" style="top:1440px">Epoch AI · คอลัมน์ users<br>ความมั่นใจ: confident / likely / speculative</div>`)}

/* ---------- end card ---------- */
function endcard(t){const e0=TH_END.erase;
  return scene(true,t,T.end,T.dur,`<div class="L mono eyebrowD" style="opacity:${1-C((t-(e0+1.6))/.4)}">Querious / <b>ข้อมูลเปิด</b></div>`,
  `<div class="L end-big">${t<e0+.9?type('ข้อมูลพร้อมแล้ว',t,TH_END.head,.8):erase('ข้อมูลพร้อมแล้ว',t,e0+.9,e0+1.7)}<span class="cur" style="opacity:${blink(t)*(1-C((t-63.45)/.45))}">_</span></div>
   <div class="L end-sub"><b style="opacity:${E((t-TH_END.sub)/.3)}">${erase('มาหาคำตอบกัน',t,e0+.45,e0+1.0)}</b></div>
   <div class="cta mono" style="${t<e0+.2?fade(t,TH_END.sub+.5,.35,12):''};${t>=e0+.6?'opacity:0':''}">${erase('querious.studio ↗',t,e0+.15,e0+.6)}</div>
   <div class="L mono end-url" style="opacity:${E((t-(TH_END.sub+.8))/.3)}">${erase('สำรวจข้อมูลได้ฟรี ไม่ต้องสมัครสมาชิก',t,e0,e0+.35)}</div>`)}

window.render=function(t){
  let html;if(t<T.race)html=hook(t);else if(t<T.question)html=race(t);else if(t<T.end)html=question(t);else html=endcard(t);
  $('#stage').innerHTML=html;
  if(t>=T.end){$('.logo').style.opacity=1-C((t-(TH_END.erase+1.65))/.45);$('.grid').style.opacity=.035*(1-C((t-63.2)/.4))}
  const cut=CUTS.find(x=>Math.abs(t-x)<.22);$('#wipe').style.display=cut===undefined?'none':'block';
  if(cut!==undefined)$('#wipe').style.transform=`translateY(${L(-1920,1920,S((t-cut+.22)/.44))}px)`;
};
window.render(0);
</script></body></html>
